    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        stark: {
                            dark: '#0A0D14',
                            card: '#111622',
                            cyan: '#00F0FF',
                            gold: '#FFB800',
                            red: '#E62429'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #07090E;
            color: #E2E8F0;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.06) 0%, transparent 60%),
                linear-gradient(to right, rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
        }

        .hud-border {
            position: relative;
            border: 1px solid rgba(0, 240, 255, 0.25);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        .hud-border:hover {
            border-color: rgba(0, 240, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        }

        .hud-border::before, .hud-border::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            border-color: #00F0FF;
            border-style: solid;
        }

        .hud-border::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
        .hud-border::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

        @keyframes rotate-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .animate-rotate { animation: rotate-slow 22s linear infinite; }

        #particles-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
    </style>
</head>
